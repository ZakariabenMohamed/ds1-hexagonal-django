<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Demandes de prêt{% endblock %} — Démo architecture hexagonale</title>
  <style>
    :root { --bg:#f6f7f9; --card:#fff; --ink:#1d2433; --muted:#5b6475; --line:#dde1e8; --accent:#1f5fbf;
            --ok:#1b7f4b; --ko:#b42318; --warn:#b36b00; }
    * { box-sizing: border-box; }
    body { margin:0; font:16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--ink); }
    header { background:var(--card); border-bottom:1px solid var(--line); }
    nav { max-width:880px; margin:0 auto; padding:14px 20px; display:flex; gap:20px; align-items:center; flex-wrap:wrap; }
    nav strong { margin-right:auto; }
    nav a { color:var(--accent); text-decoration:none; }
    main { max-width:880px; margin:24px auto; padding:0 20px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:20px; }
    h1 { font-size:1.4rem; margin:0 0 14px; }
    label { display:block; font-weight:600; margin-top:12px; }
    input { width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:6px; font:inherit; margin-top:4px; }
    button { margin-top:18px; padding:10px 18px; background:var(--accent); color:#fff; border:0; border-radius:6px; font:inherit; cursor:pointer; }
    .errorlist { color:var(--ko); list-style:none; padding:0; margin:4px 0 0; }
    table { width:100%; border-collapse:collapse; }
    th, td { text-align:left; padding:9px 8px; border-bottom:1px solid var(--line); }
    th { color:var(--muted); font-weight:600; font-size:.9rem; }
    .badge { display:inline-block; padding:2px 10px; border-radius:999px; font-weight:600; font-size:.9rem; border:1px solid currentColor; }
    .APPROVED { color:var(--ok); } .REJECTED { color:var(--ko); } .MANUAL_REVIEW { color:var(--warn); }
    .muted { color:var(--muted); }
    dl { display:grid; grid-template-columns:200px 1fr; gap:6px 16px; margin:0; }
    dt { color:var(--muted); } dd { margin:0; }
    @media (max-width:560px) { dl { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <header><nav>
    <strong>Démo : architecture hexagonale (Django)</strong>
    <a href="{% url 'loans:apply' %}">Nouvelle demande</a>
    <a href="{% url 'loans:list' %}">Historique</a>
  </nav></header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
